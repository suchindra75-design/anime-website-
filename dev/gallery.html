<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Art gallery (dev only)</title>
    <style>
      body { margin: 0; padding: 16px; background: #8a8f88; font: 12px/1.3 ui-monospace, monospace; color: #111; }
      .grid { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; }
      figure { margin: 0; background: repeating-conic-gradient(#b9bdb6 0 25%, #a9ada6 0 50%) 0 0 / 16px 16px; }
      figure img { display: block; height: var(--h, 360px); width: auto; }
      figcaption { background: #111; color: #eee; padding: 3px 6px; }
    </style>
  </head>
  <body>
    <div class="grid" id="grid"></div>
    <script type="module" src="./gallery.ts"></script>
  </body>
</html>
